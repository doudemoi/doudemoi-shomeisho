<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>どうでもいい証明書発行所</title>
  <meta
    name="description"
    content="あなたの人生で一枚だけ発行される、どうでもいい証明書。"
  >

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<body>

  <main class="container">

    <!-- サイトタイトル -->
    <header class="site-header">
      <h1>どうでもいい証明書発行所</h1>

      <p class="description">
        あなたの人生で一枚だけ発行される、<br>
        どうでもいい証明書。
      </p>
    </header>


    <!-- 名前入力 -->
    <section id="inputArea">

      <input
        type="text"
        id="nameInput"
        placeholder="名前を入力"
        maxlength="10"
        autocomplete="off"
      >

      <button id="issueButton">
        証明書を発行する
      </button>

    </section>


    <p id="status"></p>


    <!-- =========================
         証明書
    ========================== -->

    <section id="certificateArea" class="hidden">

      <div class="certificate-scale">

        <div id="certificate">

          <!-- 外枠 -->
          <div class="frame frame-outer"></div>
          <div class="frame frame-inner"></div>


          <!-- 四隅 -->
          <div class="corner corner-tl"></div>
          <div class="corner corner-tr"></div>
          <div class="corner corner-bl"></div>
          <div class="corner corner-br"></div>


          <!-- 上部 -->
          <div class="certificate-top">

            <div class="office-mark">
              CERTIFICATE OFFICE<br>
              OF NOTHING
            </div>


            <!-- コンパス・月桂樹 -->
            <div class="emblem">

              <svg
                viewBox="0 0 180 150"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >

                <!-- 月桂樹 左 -->
                <path
                  d="M58 122
                     C42 108 31 91 29 70
                     C27 49 34 29 48 14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <path
                  d="M43 104 L28 99
                     M37 91 L23 85
                     M33 76 L20 71
                     M32 60 L21 53
                     M35 44 L26 36
                     M40 29 L34 19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />


                <!-- 月桂樹 右 -->
                <path
                  d="M122 122
                     C138 108 149 91 151 70
                     C153 49 146 29 132 14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <path
                  d="M137 104 L152 99
                     M143 91 L157 85
                     M147 76 L160 71
                     M148 60 L159 53
                     M145 44 L154 36
                     M140 29 L146 19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />


                <!-- コンパス円 -->
                <circle
                  cx="90"
                  cy="65"
                  r="45"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1"
                />

                <circle
                  cx="90"
                  cy="65"
                  r="35"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="0.7"
                  stroke-dasharray="2 3"
                />


                <!-- コンパス -->
                <path
                  d="M90 15 L96 60 L90 65 L84 60 Z"
                  fill="currentColor"
                  opacity="0.9"
                />

                <path
                  d="M90 115 L84 70 L90 65 L96 70 Z"
                  fill="currentColor"
                  opacity="0.45"
                />

                <path
                  d="M40 65 L85 59 L90 65 L85 71 Z"
                  fill="currentColor"
                  opacity="0.55"
                />

                <path
                  d="M140 65 L95 71 L90 65 L95 59 Z"
                  fill="currentColor"
                  opacity="0.9"
                />

                <circle
                  cx="90"
                  cy="65"
                  r="4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                />

              </svg>

            </div>


            <div
              class="certificate-number"
              id="certificateNumber"
            ></div>

          </div>


          <!-- メインタイトル -->
          <div class="title-block">

            <h2>証 明 書</h2>

            <div class="english-title">
              CERTIFICATE OF NOTHING
            </div>

            <div class="ornamental-line">
              <span></span>
              <i></i>
              <span></span>
            </div>

          </div>


          <!-- 名前 -->
          <div class="recipient">

            <div
              class="recipient-name"
              id="certificateName"
            ></div>

          </div>


          <!-- 本文 -->
          <div class="body-content">

            <p>
              下記の事実について、
            </p>

            <p>
              あなたが
              <span id="certificateQuote"></span>
              という事実を  認証し、この証を交付します
            
            </p>


            <div class="record">

              <div class="record-title">記</div>

              <div
                class="achievement"
                id="certificateText"
              ></div>

            </div>

          </div>


          <!-- 透かし -->
          <div class="watermark">

            <svg
              viewBox="0 0 400 400"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >

              <circle
                cx="200"
                cy="200"
                r="175"
                fill="none"
              />

              <circle
                cx="200"
                cy="200"
                r="145"
                fill="none"
              />

              <circle
                cx="200"
                cy="200"
                r="115"
                fill="none"
              />

              <path
                d="
                  M200 20
                  L225 175
                  L380 200
                  L225 225
                  L200 380
                  L175 225
                  L20 200
                  L175 175
                  Z
                "
                fill="none"
              />

              <path
                d="
                  M200 55
                  C280 55 345 120 345 200
                  C345 280 280 345 200 345
                  C120 345 55 280 55 200
                  C55 120 120 55 200 55
                  Z
                "
                fill="none"
              />

            </svg>

          </div>


          <!-- 下部 -->
          <div class="bottom-area">

            <div
              class="date"
              id="certificateDate"
            ></div>


            <div class="issuer">

              <div class="issuer-name">
                どうでもいい証明書発行所
              </div>

              <div class="issuer-english">
                OFFICE OF NOTHING
              </div>

            </div>


            <div class="seal">
              <span>之</span>
              <span>印</span>
            </div>

          </div>


          <!-- 最下部 -->
          <div class="footer">

            <div class="footer-line">
              <span></span>
              <i></i>
              <span></span>
            </div>

            <p>
              ※ 本証明書は法的効力を有しません。
            </p>

            <small>
              NO LEGAL VALIDITY
            </small>

          </div>

        </div>

      </div>


      <!-- 操作ボタン -->
      <div class="certificate-actions">

        <button id="downloadButton">
          証明書を画像として保存
        </button>

        <button id="lineButton" class="secondary-button">
          LINEで送る
        </button>

        <button id="xButton" class="secondary-button">
          Xで共有
        </button>

      </div>

    </section>

  </main>


  <!-- 画像化 -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>

  <script src="script.js"></script>

</body>
</html>
